# CI untuk Mythos sendiri (bukan untuk proyek yang dibuat agen). Menangkap galat kompilasi dan tes yang gagal sebelum sampai ke perangkat.
name: CI

on:
  push:
    # Sengaja mengecualikan cabang mythos/** yang didorong oleh alat GithubBuild milik aplikasi ini.
    branches: [main, master, develop, 'dev/**', 'feature/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STORE_PASSWORD: android
      KEY_PASSWORD: android
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle dipasang oleh action ini lalu dipanggil sebagai `gradle` (bukan lewat gradlew).
      # Harus selaras dengan gradle-wrapper.properties (9.3.1) karena AGP 9.1.1 mewajibkan Gradle 9.x.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Siapkan lisensi Android SDK dan keystore CI
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass "$STORE_PASSWORD" \
              -alias upload \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Mythos CI Release Check,O=Mythos,C=ID"
          fi

      - name: Tes unit
        run: gradle --no-daemon :app:testDebugUnitTest

      # Belum memblokir: lint belum pernah dijalankan pada kode ini. Jadikan memblokir (hapus continue-on-error) setelah bersih.
      - name: Lint
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug

      - name: Bangun APK debug
        run: gradle --no-daemon :app:assembleDebug

      # Menangkap kesalahan R8/shrinker yang tidak muncul di build debug. APK release tidak ditandatangani, jadi tidak diunggah.
      # Hanya mengompilasi tes instrumented (tidak menjalankannya: butuh emulator). Menangkap galat kompilasi di folder androidTest.
      - name: Kompilasi tes instrumented
        run: gradle --no-daemon :app:assembleDebugAndroidTest

      - name: Bangun APK release (cek R8)
        run: gradle --no-daemon :app:assembleRelease

      # Peta nama R8: perlu untuk membaca stack trace crash dari APK release.
      - name: Unggah peta R8
        uses: actions/upload-artifact@v4
        with:
          name: mapping-r8
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Unggah laporan tes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-tes
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Unggah laporan lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Unggah APK debug
        uses: actions/upload-artifact@v4
        with:
          name: mythos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
